name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Копируем приложение в APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Собираем
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Переименовываем
        run: cp android/app/build/outputs/apk/release/app-release.apk wcag.apk

      - name: Публикуем релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WCAG помощник 1.${{ github.run_number }}
          body: Скачайте wcag.apk и установите на Android.
          files: wcag.apk
          make_latest: true
