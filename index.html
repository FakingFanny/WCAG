<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b4bd6">
<meta name="description" content="Карманный помощник QA по доступности: WCAG 2.2, баг-репорты, TalkBack, VoiceOver, контраст">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>WCAG помощник</title>
<style>
/* Layout: brand header with context controls, scrolling content, fixed bottom tab bar */
:root{
  --bg:#f6f4fb; --surface:#ffffff; --sunk:#efecf8; --fg:#1d1a2e; --muted:#5f5a75; --line:#e3dff0;
  --brand:#5b4bd6; --brand-soft:#ece9fd; --on-brand:#ffffff;
  --a:#15803d; --a-bg:#dcfce7; --aa:#4338ca; --aa-bg:#e0e7ff; --aaa:#a21caf; --aaa-bg:#fae8ff;
  --bad:#c2410c; --bad-bg:#ffedd5;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Roboto Mono","SFMono-Regular",monospace;
  --nav-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1f1c2c; --sunk:#191624; --fg:#ecebf5; --muted:#a8a3c0; --line:#322e45;
  --brand:#8f82f5; --brand-soft:#2a2547; --on-brand:#14121d;
  --a:#86efac; --a-bg:#173524; --aa:#a5b4fc; --aa-bg:#262b55; --aaa:#f0abfc; --aaa-bg:#3d1e45;
  --bad:#fdba74; --bad-bg:#3a2414; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1f1c2c; --sunk:#191624; --fg:#ecebf5; --muted:#a8a3c0; --line:#322e45;
  --brand:#8f82f5; --brand-soft:#2a2547; --on-brand:#14121d;
  --a:#86efac; --a-bg:#173524; --aa:#a5b4fc; --aa-bg:#262b55; --aaa:#f0abfc; --aaa-bg:#3d1e45;
  --bad:#fdba74; --bad-bg:#3a2414; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit}
.in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-radius:0 0 22px 22px}
header .in{padding-block:14px 14px;display:grid;gap:12px}
h1{margin:0;font-size:20px;font-weight:800}
#q{width:100%;font:inherit;font-size:18px;font-weight:600;padding:13px 16px;border:0;border-radius:14px;background:var(--surface);color:var(--fg)}
#q::placeholder{color:var(--muted);font-weight:500}
#q:focus{outline:3px solid color-mix(in srgb,var(--on-brand) 70%,transparent);outline-offset:2px}
.tags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tags::-webkit-scrollbar{display:none}
.tags button,.seg button{flex:none;font-size:14px;font-weight:700;padding:7px 13px;border-radius:999px;border:0;background:color-mix(in srgb,var(--on-brand) 18%,transparent);color:var(--on-brand);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand)}

/* content */
main{display:none}
main.on{display:block}
.list{display:grid;gap:10px;padding-block:14px 24px}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.card>button.sum{all:unset;box-sizing:border-box;display:grid;gap:4px;width:100%;padding:14px 16px;cursor:pointer}
.card>button.sum:focus-visible{outline:3px solid var(--brand);outline-offset:-3px;border-radius:16px}
.head{display:flex;align-items:center;gap:10px}
.num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.lvl{font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px}
.lvl.A{color:var(--a);background:var(--a-bg)} .lvl.AA{color:var(--aa);background:var(--aa-bg)} .lvl.AAA{color:var(--aaa);background:var(--aaa-bg)}
.chev{margin-left:auto;width:22px;height:22px;flex:none;display:block;color:var(--muted);transition:transform .15s}
.card.open .chev{transform:rotate(180deg)}
.name{font-size:17px;font-weight:700;text-wrap:balance}
.how{color:var(--muted)}
.det{display:none;padding:0 16px 16px;gap:12px}
.card.open .det{display:grid}
.label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.steps{margin:0;padding-left:22px;display:grid;gap:4px}
.bugex{background:var(--bad-bg);color:var(--fg);border-radius:12px;padding:10px 12px}
.bugex .label{color:var(--bad)}
.droid{font-size:14px;color:var(--muted);margin:0}
.droid b{color:var(--fg)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:14px;font-weight:700;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--brand-soft);color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.more{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.more button{font-weight:700;color:var(--brand);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px}
.empty{text-align:center;color:var(--muted);padding:30px 8px}

/* contrast */
.cwrap{display:grid;gap:12px;padding-block:14px 24px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.field>div{display:flex;gap:6px;align-items:center}
.field input[type=text],.field textarea,.field input.t{min-width:0;flex:1;width:100%;font:inherit;font-size:16px;color:var(--fg);padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.field textarea{resize:vertical;min-height:72px}
.field input[type=color]{flex:none;width:46px;height:46px;padding:0;border:1px solid var(--line);border-radius:12px;background:none}
.preview{border-radius:16px;padding:18px;border:1px solid var(--line);display:grid;gap:4px}
.preview .ratio{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.row small{color:var(--muted)}
.pill{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;flex:none}
.pill.pass{color:var(--a);background:var(--a-bg)} .pill.fail{color:var(--bad);background:var(--bad-bg)}

/* sheets */
.sheet{display:grid;gap:18px;padding-block:16px 24px}
.sec{display:grid;gap:8px}
.sec h2{margin:0;font-size:18px;font-weight:800}
.sec p{margin:0;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{min-width:0}
.kv .k small{display:block;color:var(--muted);font-size:13px}
.kv .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.gest{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.gest:first-child{border-top:0}
.gest b{font-weight:700}
.gest span{color:var(--muted)}
.cmd{display:grid;gap:6px;padding:11px 14px;border-top:1px solid var(--line)}
.cmd:first-child{border-top:0}
.cmd code{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre;display:block}
.cmd .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmd .top button{flex:none}
.check{margin:0;padding:12px 14px 12px 36px;display:grid;gap:6px}
.path{font-size:15px;padding:11px 14px;border-top:1px solid var(--line)}
.path:first-child{border-top:0}
.path b{display:block}
.path span{color:var(--muted)}
.calc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px}
.calc input,.calc select{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:92px}
.calc select{width:auto}
.calc output{font-weight:800;font-variant-numeric:tabular-nums}
.plat{display:flex;gap:8px}
.plat .btn[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.trow{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:3.6em 3.2em minmax(0,1fr);gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.trow:first-child{border-top:0}
.trow:focus-visible{outline:3px solid var(--brand);outline-offset:-3px}
.tnum{font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.trow .lvl{justify-self:start}
.tname{min-width:0}
.note{font-size:14px;color:var(--muted);background:var(--brand-soft);border-radius:12px;padding:10px 12px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
nav.tabs button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button .ic{padding:3px 18px;border-radius:999px}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs button[aria-selected="true"] .ic{background:var(--brand-soft)}

/* bug sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.bsheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);justify-self:center}
.bsheet h2{margin:0;font-size:19px;font-weight:800}
.sev{display:flex;gap:6px;flex-wrap:wrap}
.sev button{font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.sev button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sevhint{font-size:13px;color:var(--muted);margin:0}
pre.out{margin:0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;word-break:break-word;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>

<header>
  <div class="in">
    <h1 id="title">Найти критерий</h1>
    <div id="hd-find" style="display:grid;gap:10px">
      <input id="q" type="search" placeholder="Например: контраст или 2.5.8" autocomplete="off" enterkeyhint="search" aria-label="Поиск критерия WCAG">
      <div class="tags" id="tags"></div>
    </div>
    <div id="hd-sheets" class="seg" hidden>
      <button data-s="wcag" aria-pressed="true">WCAG</button>
      <button data-s="sr" aria-pressed="false">Озвучка</button>
      <button data-s="zoom" aria-pressed="false">Приближение</button>
    </div>
  </div>
</header>

<main id="p-find" class="on"><div class="in list" id="list" aria-live="polite"></div></main>

<main id="p-contrast"><div class="in cwrap">
  <div class="pair">
    <label class="field">Текст<div><input type="color" id="fgc" value="#767676" aria-label="Выбрать цвет текста"><input type="text" id="fg" value="#767676" spellcheck="false" autocapitalize="off"></div></label>
    <label class="field">Фон<div><input type="color" id="bgc" value="#ffffff" aria-label="Выбрать цвет фона"><input type="text" id="bg" value="#ffffff" spellcheck="false" autocapitalize="off"></div></label>
  </div>
  <div class="actions"><button class="btn" id="swap">⇅ Поменять местами</button></div>
  <div class="preview" id="prev"><span class="ratio" id="ratio">4.54:1</span><span>Пример обычного текста</span><span style="font-size:24px;font-weight:700">Крупный текст</span></div>
  <div id="res" style="display:grid;gap:8px"></div>
  <p class="note">Крупный текст — от 18pt (≈ 24sp) или от 14pt жирным (≈ 18.7sp). Неактивные элементы и логотипы требованию не подлежат.</p>
</div></main>

<main id="p-sheets"><div class="in" id="sheet"></div></main>

<nav class="tabs" aria-label="Разделы">
  <div class="in" role="tablist">
    <button role="tab" data-tab="find" aria-selected="true"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>Найти</button>
    <button role="tab" data-tab="contrast" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></span>Контраст</button>
    <button role="tab" data-tab="sheets" aria-selected="false"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg></span>Шпаргалки</button>
  </div>
</nav>

<div class="scrim" id="bug" hidden>
  <div class="bsheet" role="dialog" aria-modal="true" aria-labelledby="bug-h">
    <div class="grab"></div>
    <h2 id="bug-h">Баг-репорт</h2>
    <label class="field">Где (экран и элемент)<input class="t" id="b-where" placeholder="Экран «Корзина», кнопка «Удалить»"></label>
    <label class="field">Что не так (фактический результат)<textarea id="b-fact"></textarea></label>
    <label class="field">Шаги воспроизведения<textarea id="b-steps"></textarea></label>
    <div class="field">Критичность
      <div class="sev" id="b-sev">
        <button data-v="Блокер" aria-pressed="false">Блокер</button>
        <button data-v="Высокая" aria-pressed="true">Высокая</button>
        <button data-v="Средняя" aria-pressed="false">Средняя</button>
        <button data-v="Низкая" aria-pressed="false">Низкая</button>
      </div>
      <p class="sevhint" id="b-sevhint"></p>
    </div>
    <div class="field">Готовый текст<pre class="out" id="b-out"></pre></div>
    <div class="actions">
      <button class="btn primary" id="b-copy">Копировать</button>
      <button class="btn" id="b-share">Поделиться</button>
      <button class="btn" id="b-close">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const D=[
["1.1.1","A","Нетекстовый контент","Non-text Content","alt альт текст картинка изображение иконка иконки кнопка без подписи captcha капча декоративный","У изображений, иконок и кнопок-иконок есть текстовая альтернатива; декоративные скрыты от скринридера.","contentDescription; декор — importantForAccessibility=no / contentDescription=null"],
["1.2.1","A","Только аудио и только видео (запись)","Audio-only and Video-only (Prerecorded)","аудио видео подкаст расшифровка транскрипт запись без звука","Для аудиозаписи есть текстовая расшифровка, для немого видео — текст или аудиоописание."],

["1.3.2","A","Значимая последовательность","Meaningful Sequence","порядок чтения последовательность скринридер talkback","Порядок чтения скринридером соответствует смыслу.","порядок обхода TalkBack, accessibilityTraversalBefore/After"],

["1.3.4","AA","Ориентация","Orientation","ориентация поворот экрана портрет ландшафт альбомная книжная","Контент работает и в портретной, и в альбомной ориентации, если она не обязательна.","screenOrientation не залочена без причины"],
["1.3.5","AA","Определение назначения поля","Identify Input Purpose","автозаполнение autocomplete поле ввода форма email телефон","Поля с данными пользователя имеют программно определяемое назначение.","autofillHints"],

const NATIVE = typeof window.AndroidApp !== "undefined";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().replace(/ё/g, "е");
const slug = en => en.toLowerCase().replace(/[(),]/g, "").replace(/\s+/g, "-");

let tt;
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600)}
function copy(txt, msg){
  const done=()=>toast(msg||"Скопировано");
  if(NATIVE){try{AndroidApp.copy(txt);done();return}catch(e){}}
  const fb=()=>{const a=document.createElement("textarea");a.value=txt;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Не удалось скопировать")}a.remove()};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb();
}
function share(txt){
  if(NATIVE){try{AndroidApp.share(txt);return}catch(e){}}
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});else copy(txt,"Скопировано — вставь куда нужно");
}
function device(){
  if(NATIVE){try{return AndroidApp.device()}catch(e){}}
  const ua=navigator.userAgent, m=ua.match(/Android ([\d.]+);\s*([^;)]+)/);
  if(m) return m[2].trim()+", Android "+m[1];
  if(/iPhone|iPad/.test(ua)){const v=ua.match(/OS ([\d_]+)/);return "iPhone, iOS "+(v?v[1].replace(/_/g,"."):"")}
  return "Устройство: указать";
}

const items=D.map(r=>({id:r[0],l:r[1],ru:r[2],en:r[3],kw:r[4],how:r[5],droid:r[6],t:T[r[0]],hay:norm([r[0],r[2],r[3],r[4],r[5],r[6]||""].join(" "))}));
const byId=Object.fromEntries(items.map(i=>[i.id,i]));

const QUICK=["контраст","talkback","кнопка","размер","фокус","шрифт","ошибка","форма","жесты","анимация"];

function score(it,tokens){
  let s=0;
  for(const t of tokens){
    if(/^[\d.]+$/.test(t)){ if(it.id===t)s+=100; else if(it.id.startsWith(t))s+=20; else return 0; continue }
    const st=t.length>4?t.slice(0,Math.max(4,t.length-2)):t;
    if(norm(it.ru).includes(st))s+=12;
    else if(norm(it.kw).split(" ").some(w=>w.startsWith(st)||(st.startsWith(w)&&w.length>3)))s+=8;
    else if(it.hay.includes(st))s+=3;
    else return 0;
  }
  return s;
}
const chev='<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function card(it){
  const t=it.t;
  return `<article class="card" data-id="${it.id}">
    <button class="sum" aria-expanded="false">
      <span class="head"><span class="num">${it.id}</span><span class="lvl ${it.l}">${it.l}</span>${chev}</span>
      <span class="name">${esc(it.ru)}</span>
      <span class="how">${esc(it.how)}</span>
    </button>
    <div class="det">
      ${t?`<div><p class="label">Как проверить</p><ol class="steps">${t[0].map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
      ${it.droid?`<p class="droid"><b>Android:</b> ${esc(it.droid)}</p>`:""}
      ${t?`<div class="bugex"><p class="label">Типичный баг</p>${esc(t[1])}</div>`:""}
      <div class="actions">
        <button class="btn primary" data-bug="${it.id}">Завести баг</button>
        <button class="btn" data-copy="WCAG ${it.id} ${esc(it.en)} (${it.l})">Копировать номер</button>
        <a class="btn" href="https://www.w3.org/WAI/WCAG22/Understanding/${slug(it.en)}" target="_blank" rel="noopener">W3C ↗</a>
      </div>
    </div>
  </article>`;
}
function render(){
  const q=$("q").value, tokens=norm(q).trim().split(/[\s,]+/).filter(Boolean);
  let res=items;
  if(tokens.length) res=items.map(it=>[it,score(it,tokens)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const exact=tokens.length===1&&byId[tokens[0]];
  const hidden=(showAAA||exact)?0:res.filter(i=>i.l==="AAA").length;
  if(!showAAA&&!exact) res=res.filter(i=>i.l!=="AAA");
  let html=res.map(card).join("");
  if(!res.length) html=`<p class="empty">Ничего не нашлось. Попробуй другое слово или номер критерия.</p>`;
  if(hidden) html+=`<div class="more">Ещё ${hidden} уровня AAA <button id="aaa">Показать</button></div>`;
  else if(showAAA) html+=`<div class="more"><button id="aaa">Скрыть AAA</button></div>`;
  $("list").innerHTML=html;
  if(res.length===1) toggleCard($("list").querySelector(".card"),true);
}
function toggleCard(c,force){
  const open=force!==undefined?force:!c.classList.contains("open");
  c.classList.toggle("open",open);
  c.querySelector(".sum").setAttribute("aria-expanded",open);
}
$("q").addEventListener("input",render);

$("tags").addEventListener("click",e=>{if(e.target.tagName==="BUTTON"){$("q").value=e.target.textContent;render();window.scrollTo(0,0)}});

function hex(v){v=v.trim().replace(/^#/,"");if(/^[0-9a-f]{3}$/i.test(v))v=v.split("").map(c=>c+c).join("");return /^[0-9a-f]{6}$/i.test(v)?"#"+v.toLowerCase():null}
function lum(h){const n=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4));return .2126*n[0]+.7152*n[1]+.0722*n[2]}
function calc(){
  const f=hex($("fg").value),b=hex($("bg").value);
  if(!f||!b){$("ratio").textContent="—";$("res").innerHTML='<p class="empty">Введи цвет, например #333 или #1a1a1a</p>';return}
  $("fgc").value=f;$("bgc").value=b;
  const L1=lum(f),L2=lum(b),r=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
  $("ratio").textContent=(Math.floor(r*100)/100).toFixed(2)+":1";
  $("prev").style.color=f;$("prev").style.background=b;
  const rows=[["Обычный текст","1.4.3 AA",4.5],["Крупный текст","1.4.3 AA",3],["Иконки, границы полей","1.4.11 AA",3],["Обычный текст","1.4.6 AAA",7],["Крупный текст","1.4.6 AAA",4.5]];
  $("res").innerHTML=rows.map(([n,c,t])=>`<div class="row"><span>${n}<br><small>${c} · нужно ${t}:1</small></span><span class="pill ${r>=t?"pass":"fail"}">${r>=t?"OK":"Нет"}</span></div>`).join("");
}
["fg","bg"].forEach(id=>$(id).addEventListener("input",calc));

  <div class="actions"><button class="btn" data-copy="${list.map(i=>i.id).join(", ")}">Копировать все номера</button></div>`;
}

function renderSheet(){
  $("sheet").innerHTML=`<div class="sheet">${SHEETS[SHEET]()}</div>`;
  document.querySelectorAll("#hd-sheets button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===SHEET));
  if(SHEET==="wcag"){const up=()=>{const v=parseFloat($("dp").value)||0;$("px").textContent=Math.round(v*parseFloat($("dens").value))+" px"};$("dp").oninput=up;$("dens").onchange=up;up()}
}
$("hd-sheets").addEventListener("click",e=>{const b=e.target.closest("button");if(b){SHEET=b.dataset.s;renderSheet();window.scrollTo(0,0)}});

/* ---------- общие клики ---------- */
document.addEventListener("click",e=>{
  const sum=e.target.closest(".sum"); if(sum){toggleCard(sum.parentElement);return}
  const c=e.target.closest("[data-copy]"); if(c){copy(c.dataset.copy);return}
  const b=e.target.closest("[data-bug]"); if(b){openBug(b.dataset.bug);return}
  const p=e.target.closest("[data-plat]"); if(p){OS=p.dataset.plat;try{localStorage.setItem("os",OS)}catch(_){}renderSheet();return}
  const tp=e.target.closest("[data-topic]"); if(tp){TOPIC=tp.dataset.topic;try{localStorage.setItem("topic",TOPIC)}catch(_){}const y=window.scrollY;renderSheet();window.scrollTo(0,y);return}
  const gt=e.target.closest("[data-goto]"); if(gt){fromSheet=true;go("find");$("q").value=gt.dataset.goto;render();return}
  if(e.target.id==="aaa"){showAAA=!showAAA;render()}
});
let fromSheet=false;

/* ---------- вкладки и переходы ---------- */
const TITLES={find:"Найти критерий",contrast:"Проверка контраста",sheets:"Шпаргалки"};
let TAB="find";
function go(tab,sheet){
  TAB=tab;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["find","contrast","sheets"].forEach(t=>$("p-"+t).classList.toggle("on",t===tab));
  $("title").textContent=TITLES[tab];
  $("hd-find").hidden=tab!=="find"; $("hd-sheets").hidden=tab!=="sheets";
  if(tab==="sheets"){if(sheet)SHEET=sheet;renderSheet()}
  window.scrollTo(0,0);
}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){fromSheet=false;go(b.dataset.tab)}});
// Ярлыки: #contrast, #sr, #zoom, #wcag, #find
window.route=function(r){
  r=(r||"").replace("#","");
  if(r==="contrast")go("contrast");
  else if(["sr","zoom","wcag"].includes(r))go("sheets",r);
  else if(r==="find"){go("find");$("q").focus()}
};
// Кнопка «Назад» Android: true — обработано внутри
window.goBack=function(){
  if(!$("bug").hidden){closeBug();return true}
  if(TAB!=="find"){go("find");return true}
  if(fromSheet){fromSheet=false;$("q").value="";render();go("sheets");return true}
  const open=document.querySelector(".card.open"); if(open&&document.querySelectorAll(".card").length>1){toggleCard(open,false);return true}
  if($("q").value){$("q").value="";render();window.scrollTo(0,0);return true}
  return false;
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("bug").hidden)closeBug()});

render(); calc(); route(location.hash);
if(!NATIVE&&"serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
