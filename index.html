<title>WCAG Справочник</title>


<style>
/* Layout: colored header band with search, simple card list below */
:root{
  --bg:#f6f4fb; --surface:#ffffff; --fg:#1d1a2e; --muted:#5f5a75; --line:#e3dff0;
  --brand:#5b4bd6; --brand-soft:#ece9fd; --on-brand:#ffffff;
  --a:#15803d; --a-bg:#dcfce7; --aa:#4338ca; --aa-bg:#e0e7ff; --aaa:#a21caf; --aaa-bg:#fae8ff;
  --ok:#15803d; --bad:#c2410c;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121d; --surface:#1f1c2c; --fg:#ecebf5; --muted:#a8a3c0; --line:#322e45;
  --brand:#8f82f5; --brand-soft:#2a2547; --on-brand:#14121d;
  --a:#86efac; --a-bg:#173524; --aa:#a5b4fc; --aa-bg:#262b55; --aaa:#f0abfc; --aaa-bg:#3d1e45;
  --ok:#86efac; --bad:#fdba74; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14121d; --surface:#1f1c2c; --fg:#ecebf5; --muted:#a8a3c0; --line:#322e45;
  --brand:#8f82f5; --brand-soft:#2a2547; --on-brand:#14121d;
  --a:#86efac; --a-bg:#173524; --aa:#a5b4fc; --aa-bg:#262b55; --aaa:#f0abfc; --aaa-bg:#3d1e45;
  --ok:#86efac; --bad:#fdba74; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--on-brand);border-radius:0 0 22px 22px}
header .in{padding-block:14px 16px;display:grid;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:19px;font-weight:800}
.seg{display:flex;background:color-mix(in srgb,var(--on-brand) 18%,transparent);border-radius:999px;padding:3px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:999px;padding:7px 14px;background:transparent;color:var(--on-brand);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--brand)}
#q{width:100%;font:inherit;font-size:18px;font-weight:600;padding:14px 16px;border:0;border-radius:14px;background:var(--surface);color:var(--fg)}
#q::placeholder{color:var(--muted);font-weight:500}
#q:focus{outline:3px solid color-mix(in srgb,var(--on-brand) 70%,transparent);outline-offset:2px}
.tags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.tags button{flex:none;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;border:0;background:color-mix(in srgb,var(--on-brand) 18%,transparent);color:var(--on-brand);cursor:pointer}
main .in{padding-block:14px 40px;display:grid;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:6px;border:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px}
.num{font:inherit;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand);background:none;border:0;padding:0;cursor:pointer}
.lvl{font-size:13px;font-weight:800;padding:3px 9px;border-radius:8px}
.lvl.A{color:var(--a);background:var(--a-bg)} .lvl.AA{color:var(--aa);background:var(--aa-bg)} .lvl.AAA{color:var(--aaa);background:var(--aaa-bg)}
.copy{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft);border:0;border-radius:10px;padding:7px 11px;cursor:pointer}
.name{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.how{margin:0;color:var(--muted)}
.droid{margin:0;font-size:14px;color:var(--muted)}
.droid b{color:var(--fg)}
.more{display:flex;justify-content:center;gap:12px;align-items:center;color:var(--muted);font-size:14px;padding-top:4px}
.more button{font:inherit;font-weight:700;color:var(--brand);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;color:var(--muted);padding:30px 8px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
/* contrast */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.field div{display:flex;gap:6px;align-items:center}
.field input[type=text]{min-width:0;flex:1;font:inherit;font-size:16px;color:var(--fg);padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.field input[type=color]{flex:none;width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:12px;background:none}
.preview{border-radius:16px;padding:18px;border:1px solid var(--line);display:grid;gap:4px}
.preview .ratio{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.preview .small{font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.row small{color:var(--muted)}
.pill{font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px}
.pill.pass{color:var(--a);background:var(--a-bg)} .pill.fail{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.swap{justify-self:start;font:inherit;font-weight:700;font-size:14px;color:var(--brand);background:var(--brand-soft);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20}
</style>

</head><body><header>
  <div class="in">
    <div class="bar">
      <h1>WCAG помощник</h1>
      <div class="seg" role="tablist">
        <button role="tab" id="t1" aria-selected="true">Поиск</button>
        <button role="tab" id="t2" aria-selected="false">Контраст</button>
      </div>
    </div>
    <div id="sbox" style="display:grid;gap:10px">
      <input id="q" type="search" placeholder="Например: контраст" autocomplete="off" enterkeyhint="search" aria-label="Что проверяете?">
      <div class="tags" id="tags"></div>
    </div>
  </div>
</header>

<main id="p1"><div class="in" id="list" aria-live="polite"></div></main>

<main id="p2" hidden><div class="in">
  <div class="pair">
    <label class="field">Текст<div><input type="color" id="fgc" value="#767676" aria-label="Цвет текста"><input type="text" id="fg" value="#767676" spellcheck="false"></div></label>
    <label class="field">Фон<div><input type="color" id="bgc" value="#ffffff" aria-label="Цвет фона"><input type="text" id="bg" value="#ffffff" spellcheck="false"></div></label>
  </div>
  <button class="swap" id="swap">⇅ Поменять</button>
  <div class="preview" id="prev"><span class="ratio" id="ratio">4.54:1</span><span>Пример текста</span><span class="small">Мелкий текст для проверки</span></div>
  <div id="res" style="display:grid;gap:8px"></div>
</div></main>

<div class="toast" id="toast" hidden></div>

const QUICK=["контраст","фокус","alt","кнопка","размер","ошибка","форма","анимация","видео","talkback"];
const norm=s=>s.toLowerCase().replace(/ё/g,"е");
const items=D.map(r=>({id:r[0],l:r[1],ru:r[2],en:r[3],kw:r[4],how:r[5],droid:r[6],hay:norm(r.join(" "))}));
let showAAA=false;
const $=id=>document.getElementById(id),q=$("q"),list=$("list");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function score(it,tokens){
  let s=0;
  for(const t of tokens){
    if(/^[\d.]+$/.test(t)){ if(it.id===t)s+=100; else if(it.id.startsWith(t))s+=20; else return 0; continue }
    const st=t.length>4?t.slice(0,Math.max(4,t.length-2)):t;
    if(norm(it.ru).includes(st))s+=12;
    else if(norm(it.kw).split(" ").some(w=>w.startsWith(st)||(st.startsWith(w)&&w.length>3)))s+=8;
    else if(it.hay.includes(st))s+=3;
    else return 0;
  }
  return s;
}
function render(){
  const tokens=norm(q.value).trim().split(/[\s,]+/).filter(Boolean);
  let res=items;
  if(tokens.length) res=items.map(it=>[it,score(it,tokens)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const hidden=showAAA?0:res.filter(i=>i.l==="AAA").length;
  if(!showAAA) res=res.filter(i=>i.l!=="AAA");
  let html=res.map(it=>`<article class="card">
    <div class="head"><span class="num">${it.id}</span><span class="lvl ${it.l}">${it.l}</span><button class="copy" data-copy="WCAG ${it.id} ${esc(it.en)} (${it.l})" aria-label="Скопировать ${it.id}">Копировать</button></div>
    <h2 class="name">${esc(it.ru)}</h2>
    <p class="how">${esc(it.how)}</p>
    ${it.droid?`<p class="droid"><b>Android:</b> ${esc(it.droid)}</p>`:""}
  </article>`).join("");
  if(!res.length) html=`<p class="empty">Ничего не нашлось. Попробуйте другое слово.</p>`;
  if(hidden) html+=`<div class="more">Ещё ${hidden} уровня AAA <button id="aaa">Показать</button></div>`;
  else if(showAAA) html+=`<div class="more"><button id="aaa">Скрыть AAA</button></div>`;
  list.innerHTML=html;
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1500)}
function copy(txt){
  const done=()=>toast("Скопировано: "+txt);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done)); else fallback(txt,done);
}
function fallback(txt,done){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast(txt)}a.remove()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]");if(b)copy(b.dataset.copy);
  if(e.target.id==="aaa"){showAAA=!showAAA;render()}
});
q.addEventListener("input",render);
$("tags").innerHTML=QUICK.map(w=>`<button>${w}</button>`).join("");
$("tags").onclick=e=>{if(e.target.tagName==="BUTTON"){q.value=e.target.textContent;render()}};
function tab(n){const a=n===1;$("t1").setAttribute("aria-selected",a);$("t2").setAttribute("aria-selected",!a);$("p1").hidden=!a;$("sbox").hidden=!a;$("p2").hidden=a}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);

function hex(v){v=v.trim().replace(/^#/,"");if(/^[0-9a-f]{3}$/i.test(v))v=v.split("").map(c=>c+c).join("");return /^[0-9a-f]{6}$/i.test(v)?"#"+v.toLowerCase():null}
function lum(h){const n=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4));return .2126*n[0]+.7152*n[1]+.0722*n[2]}
function calc(){
  const f=hex($("fg").value),b=hex($("bg").value);
  if(!f||!b){$("ratio").textContent="—";$("res").innerHTML='<p class="empty">Введите цвет, например #333 или #1a1a1a</p>';return}
  $("fgc").value=f;$("bgc").value=b;
  const L1=lum(f),L2=lum(b),r=(Math.max(L1,L2)+.05)/(Math.min(L1,L2)+.05);
  $("ratio").textContent=(Math.floor(r*100)/100).toFixed(2)+":1";
  $("prev").style.color=f;$("prev").style.background=b;
  const rows=[["Обычный текст","1.4.3 AA",4.5],["Крупный текст","1.4.3 AA",3],["Иконки и границы","1.4.11 AA",3],["Обычный текст","1.4.6 AAA",7]];
  $("res").innerHTML=rows.map(([n,c,t])=>`<div class="row"><span>${n}<br><small>${c} · нужно ${t}:1</small></span><span class="pill ${r>=t?"pass":"fail"}">${r>=t?"OK":"Нет"}</span></div>`).join("");
}
["fg","bg"].forEach(id=>$(id).addEventListener("input",calc));
$("fgc").oninput=e=>{$("fg").value=e.target.value;calc()};
$("bgc").oninput=e=>{$("bg").value=e.target.value;calc()};
$("swap").onclick=()=>{const a=$("fg").value;$("fg").value=$("bg").value;$("bg").value=a;calc()};
q.value="контраст";render();calc();

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
